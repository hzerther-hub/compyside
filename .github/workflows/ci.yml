name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libegl1 libxkbcommon-x11-0 \
                                  libdbus-1-3 libxcb-cursor0 libheif-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,heif,psd]"
          pip install rawpy || echo "rawpy install skipped (Linux may lack libraw-dev)"

      - name: Run parity-report unit check
        shell: bash
        run: |
          python tools/parity_report.py \
            --projects-dir tests/fixtures \
            --reference-dir tests/fixtures/_refs \
            --output-dir dist/parity || true

      - name: Run pytest
        run: pytest -ra --tb=short

      - name: i18n coverage gate
        # Every language must translate ≥ 80% of the English keys. The
        # threshold is set conservatively because the auto-translate tool
        # uses MyMemory's free tier (5000 chars/day per IP), so a fresh
        # push with new English keys won't have every language at 95%
        # until the missing entries are translated (manually or after
        # MyMemory quota resets). To bump the threshold, run
        # ``python tools/i18n_translate.py --apply`` for the lagging
        # languages from a machine with a fresh MyMemory quota.
        shell: bash
        run: |
          set -e
          python tools/i18n_coverage.py --threshold 80 | tee dist/i18n-coverage.txt || {
            echo "::error::i18n coverage below 80% — see dist/i18n-coverage.txt"
            exit 1
          }

      - name: Upload parity artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-${{ matrix.os }}
          path: dist/parity/

  i18n-coverage:
    name: i18n coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Generate coverage report (informational, never fails)
        shell: bash
        run: |
          python tools/i18n_coverage.py --threshold 0 | tee dist/i18n-coverage.txt
      - uses: actions/upload-artifact@v4
        with:
          name: i18n-coverage
          path: dist/i18n-coverage.txt
          if-no-files-found: warn
          if-no-files-found: ignore

  linux-deb:
    name: Linux .deb
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install briefcase + system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libegl1 libxkbcommon-x11-0 \
                                  libdbus-1-3 libxcb-cursor0 fuse libfuse2
          pip install briefcase
      - name: briefcase create + build + package (.deb)
        run: |
          briefcase create linux
          briefcase build linux
          briefcase package linux --format deb
      - uses: actions/upload-artifact@v4
        with:
          name: compositor-linux-deb
          path: dist/*.deb

  linux-appimage:
    name: Linux .AppImage
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install briefcase + system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libegl1 libxkbcommon-x11-0 \
                                  libdbus-1-3 libxcb-cursor0 fuse libfuse2
          pip install briefcase
      - run: |
          briefcase create linux
          briefcase build linux
          briefcase package linux --format appimage
      - uses: actions/upload-artifact@v4
        with:
          name: compositor-linux-appimage
          path: dist/*.AppImage

  windows-msi:
    name: Windows .msi
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install briefcase
      - run: |
          briefcase create windows
          briefcase build windows
          briefcase package windows
      - uses: actions/upload-artifact@v4
        with:
          name: compositor-windows-msi
          path: dist/*.msi

  macos-dmg:
    name: macOS .dmg
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install briefcase
      - run: |
          briefcase create macOS
          briefcase build macOS
          briefcase package macOS --no-notarize
      - uses: actions/upload-artifact@v4
        with:
          name: compositor-macos-dmg
          path: dist/*.dmg
